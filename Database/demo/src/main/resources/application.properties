spring.application.name=demo

# Use the PORT environment variable provided by the host (default to 8080)
server.port=8080

# MySQL Connection Details - Using environment variables for production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fileapp_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Hibernate Properties (This creates the 'users' table automatically)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Brevo API Configuration for Email
app.brevo.api-key=${BREVO_API_KEY:}
app.frontend.url=${FRONTEND_URL:https://www.bharathomevalue.live}

# Google OAuth2 Credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile,email

# Admin Credentials (set via environment variables on Render)
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# File Upload Configuration (Allow for property photos)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-http-post-size=20MB

# Performance
spring.jpa.properties.hibernate.jdbc.batch_size=20
